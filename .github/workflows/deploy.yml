name: Deploy DigitalOcean

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar Bot PortoPlan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar conexão SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/portoplan_bot_deploy
          chmod 600 ~/.ssh/portoplan_bot_deploy
          ssh-keyscan -H 138.197.86.14 >> ~/.ssh/known_hosts

      - name: Implantar versão atual
        shell: bash
        run: |
          ssh -i ~/.ssh/portoplan_bot_deploy \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            root@138.197.86.14 \
            'set -e
             APP_DIR=/root/workspace/bot
             mkdir -p /root/workspace
             if [ ! -d "$APP_DIR/.git" ]; then
               git clone https://github.com/lrubinger/bot.git "$APP_DIR"
             else
               cd "$APP_DIR"
               git pull --ff-only origin main
             fi
             cd "$APP_DIR"
             test -f backend/.env || { echo "Arquivo backend/.env não configurado"; exit 1; }
             test -f frontend/.env || { echo "Arquivo frontend/.env não configurado"; exit 1; }
             cd backend
             npm install
             npm run build
             npm run db:migrate
             pm2 restart portoplan-bot-backend || pm2 start dist/server.js --name portoplan-bot-backend
             cd ../frontend
             npm install
             npm run build
             pm2 restart portoplan-bot-frontend || pm2 start server.js --name portoplan-bot-frontend
             pm2 save
             pm2 status'
