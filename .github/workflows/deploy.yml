name: Deploy DigitalOcean

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar Bot PortoPlan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configurar conexão SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -e
          test -n "$DEPLOY_SSH_KEY" || { echo "Secret DEPLOY_SSH_KEY nao configurado"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/portoplan_bot_deploy
          chmod 600 ~/.ssh/portoplan_bot_deploy
          ssh-keygen -y -f ~/.ssh/portoplan_bot_deploy >/dev/null || {
            echo "Secret DEPLOY_SSH_KEY invalido. Cole a chave privada OpenSSH completa."
            exit 1
          }
          ssh-keyscan -H 138.197.86.14 >> ~/.ssh/known_hosts

      - name: Implantar versão atual
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$GOOGLE_CLIENT_ID" || { echo "Secret GOOGLE_CLIENT_ID nao configurado"; exit 1; }
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "Secret GOOGLE_CLIENT_SECRET nao configurado"; exit 1; }

          GOOGLE_CLIENT_ID_B64="$(printf '%s' "$GOOGLE_CLIENT_ID" | base64 -w0)"
          GOOGLE_CLIENT_SECRET_B64="$(printf '%s' "$GOOGLE_CLIENT_SECRET" | base64 -w0)"

          ssh -i ~/.ssh/portoplan_bot_deploy             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -o ServerAliveInterval=30             root@138.197.86.14 "GOOGLE_CLIENT_ID_B64='$GOOGLE_CLIENT_ID_B64' GOOGLE_CLIENT_SECRET_B64='$GOOGLE_CLIENT_SECRET_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR=/root/bot-teste
          BRANCH=recuperacao-backend
          WEB_DIR=/var/www/portoplan-bot

          GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_CLIENT_ID_B64" | base64 -d)"
          GOOGLE_CLIENT_SECRET="$(printf '%s' "$GOOGLE_CLIENT_SECRET_B64" | base64 -d)"
          ENV_FILE="$APP_DIR/backend/.env"

          touch "$ENV_FILE"
          TMP_ENV="$(mktemp)"
          grep -v '^GOOGLE_CLIENT_ID=' "$ENV_FILE" | grep -v '^GOOGLE_CLIENT_SECRET=' | grep -v '^GOOGLE_CONTACTS_REDIRECT_URI=' > "$TMP_ENV" || true
          cat "$TMP_ENV" > "$ENV_FILE"
          rm -f "$TMP_ENV"
          printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID" >> "$ENV_FILE"
          printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" >> "$ENV_FILE"
          printf 'GOOGLE_CONTACTS_REDIRECT_URI=https://bot.portoplan.com.br/api/google/contacts/callback\n' >> "$ENV_FILE"

          TMP_ENV="$(mktemp)"
          grep -v '^PUBLIC_BACKEND_URL=' "$ENV_FILE" | grep -v '^FRONTEND_URL=' "$ENV_FILE" > "$TMP_ENV" || true
          cat "$TMP_ENV" > "$ENV_FILE"
          rm -f "$TMP_ENV"
          printf 'PUBLIC_BACKEND_URL=https://bot.portoplan.com.br/api\n' >> "$ENV_FILE"
          printf 'FRONTEND_URL=https://bot.portoplan.com.br\n' >> "$ENV_FILE"

          cd "$APP_DIR"
          git reset --hard HEAD
          git clean -fd -e backend/.env -e backend/public/ -e frontend/.env -e frontend/.env.local
          git pull --ff-only origin "$BRANCH"

          cd "$APP_DIR/backend"
          npm install
          npm run build

          RESET_MARKER="$APP_DIR/.lucas_password_reset_20261007"
          if [ ! -f "$RESET_MARKER" ]; then
            RESET_LUCAS_PASSWORD="PP-$(node -e "const c=require('crypto'); process.stdout.write(c.randomBytes(9).toString('base64url'))")!"
            export RESET_LUCAS_PASSWORD
            npm run db:migrate
            touch "$RESET_MARKER"
            echo "TEMP_PASSWORD_LUCAS=$RESET_LUCAS_PASSWORD"
          else
            npm run db:migrate
          fi

          pkill -f "$APP_DIR/backend/dist/server.js" >/dev/null 2>&1 || true
          pkill -f "node .*dist/server.js" >/dev/null 2>&1 || true
          fuser -k 4000/tcp >/dev/null 2>&1 || true
          sleep 1

          nohup node "$APP_DIR/backend/dist/server.js" > "$APP_DIR/backend-mvp.log" 2>&1 &
          BACKEND_PID=$!

          BACKEND_READY=0
          for i in $(seq 1 20); do
            if ! kill -0 "$BACKEND_PID" >/dev/null 2>&1; then
              echo "BACKEND_START_FAILED"
              tail -n 160 "$APP_DIR/backend-mvp.log" || true
              exit 1
            fi

            if curl -fsS --max-time 3 http://127.0.0.1:4000/health >/dev/null 2>&1; then
              BACKEND_READY=1
              break
            fi

            sleep 1
          done

          if [ "$BACKEND_READY" -ne 1 ]; then
            echo "BACKEND_HTTP_FAILED"
            tail -n 160 "$APP_DIR/backend-mvp.log" || true
            exit 1
          fi

          mkdir -p "$WEB_DIR"
          rm -rf "$WEB_DIR"/*
          cp -a "$APP_DIR/frontend-mvp/." "$WEB_DIR/"
          chown -R www-data:www-data "$WEB_DIR"
          find "$WEB_DIR" -type d -exec chmod 755 {} \;
          find "$WEB_DIR" -type f -exec chmod 644 {} \;

          nginx -t
          systemctl reload nginx

          curl -fsS --max-time 5 http://127.0.0.1:4000/health >/dev/null
          curl -fsS --max-time 10 https://bot.portoplan.com.br/health >/dev/null

          echo "DEPLOY_OK"
          REMOTE
