name: Deploy DigitalOcean

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar Bot PortoPlan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar conexão SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/portoplan_bot_deploy
          chmod 600 ~/.ssh/portoplan_bot_deploy
          ssh-keyscan -H 138.197.86.14 >> ~/.ssh/known_hosts

      - name: Implantar versão atual
        shell: bash
        run: |
          ssh -i ~/.ssh/portoplan_bot_deploy \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            root@138.197.86.14 \
            'set -e
             APP_DIR=/home/deploy/bot
             test -d "$APP_DIR/.git" || { echo "Execute primeiro installer/install_primaria"; exit 1; }
             test -f "$APP_DIR/backend/.env" || { echo "Arquivo backend/.env não configurado"; exit 1; }
             test -f "$APP_DIR/frontend/.env" || { echo "Arquivo frontend/.env não configurado"; exit 1; }
             sudo -u deploy -H bash -lc "
               set -e
               cd /home/deploy/bot
               git pull --ff-only origin main
               cd backend
               npm install
               npm run build
               npm run db:migrate
               pm2 restart bot-backend
               cd ../frontend
               npm install
               npm run build
               pm2 restart bot-frontend
               pm2 save
               pm2 status
             "'
