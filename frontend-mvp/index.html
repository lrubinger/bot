<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>PortoPlan Bot</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <button type="button" id="themeToggleLogin" class="theme-toggle floating-theme" aria-label="Alternar tema">☀️</button>
  <div id="login" class="login-wrap">
    <div class="login-shell">
      <div class="login-brand">
        <img src="./assets/logo.png" alt="PortoPlan" class="login-logo" />
        <span>BOT</span>
      </div>
      <div class="login-card">
        <div class="login-card-head">
          <div class="eyebrow">PORTOPLAN BOT</div>
          <h1>Acesse sua conta</h1>
          <p class="login-copy">Entre para gerenciar suas conexões e atendimentos.</p>
        </div>
        <form id="loginForm">
          <label>E-mail</label>
          <input id="email" type="email" autocomplete="username" required />
          <label>Senha</label>
          <div class="password-field">
            <input id="password" type="password" autocomplete="current-password" required />
            <button type="button" id="togglePassword" class="password-eye" aria-label="Mostrar senha" title="Mostrar senha">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
              </svg>
              <svg class="eye-closed hidden" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18M10.6 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-3.1 3.8M6.1 6.1C3.8 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.3-.2 3.3-.6M9.9 9.9A3 3 0 0 0 14.1 14.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <button type="submit" class="login-submit">Entrar</button>
        </form>
        <div id="loginError" class="error"></div>
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="./assets/logo.png" alt="PortoPlan" class="sidebar-logo" />
        <div class="product-chip">BOT</div>
      </div>
      <nav id="menu"></nav>
      <div class="sidebar-footer">PortoPlan • Ambiente de teste</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">PortoPlan Bot</div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="muted" id="userLine"></div>
        </div>
        <div class="topbar-actions">
          <button type="button" id="themeToggleApp" class="theme-toggle" aria-label="Alternar tema">☀️</button>
          <button id="logoutBtn" class="ghost">Sair</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="modalClose" class="modal-close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
